name: Deploy static content to Pages

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - main.py
      - pyproject.toml
      - uv.lock
      - config.toml
      - static/**
      - src/ai_daily/site_dates.py
      - .github/workflows/generate_site.yml
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      ISITE_VERSION: v0.2.4
      ZOLA_VERSION: v0.23.3
      EVEN_THEME_COMMIT: 56015feedb5b3d6a7b74c077568449892cf8b458
      USER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.9.28
          uv sync --frozen --no-dev
      - name: Generate markdown and build site
        run: |
          uv run --frozen python main.py ${{ github.repository }}
          gh release download $ISITE_VERSION --repo kemingy/isite -p '*linux_amd64*' --output isite.tar.gz
          tar zxf isite.tar.gz && mv isite /usr/local/bin
          isite generate --user $USER --repo $REPO
          uv run --frozen python -m ai_daily.site_dates output/content
          git -C output/themes/even checkout --detach "$EVEN_THEME_COMMIT"
          gh release download $ZOLA_VERSION --repo getzola/zola \
            -p '*x86_64-unknown-linux-gnu*' --output zola.tar.gz
          tar zxf zola.tar.gz && mv zola /usr/local/bin
          cp config.toml output/config.toml
          mkdir -p output/static
          cp -r static/. output/static/
          (cd output && zola build --base-url $BASE_URL)
          # Inject versioned assets, favicon, and SEO meta tags (single sed pass)
          GIT_SHA=$(git rev-parse --short HEAD)
          EDITORIAL_HREF="${BASE_URL%/}/editorial.css?v=${GIT_SHA}"
          CSS_HREF="${BASE_URL%/}/custom.css?v=${GIT_SHA}"
          JS_SRC="${BASE_URL%/}/site.js?v=${GIT_SHA}"
          ICON_HREF="${BASE_URL%/}/icon.png?v=${GIT_SHA}"
          SITE_TITLE="甲鱼AI日报"
          SITE_DESC="每日 AI 前沿技术情报，由 AI 辅助创作"
          find output/public -name "*.html" -exec sed -i \
            -e "s|</head>|<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><meta name=\"description\" content=\"${SITE_DESC}\"><meta property=\"og:title\" content=\"${SITE_TITLE}\"><meta property=\"og:description\" content=\"${SITE_DESC}\"><meta property=\"og:image\" content=\"${BASE_URL%/}/icon.png\"><meta property=\"og:type\" content=\"website\"><link rel=\"stylesheet\" href=\"${EDITORIAL_HREF}\"><link rel=\"stylesheet\" href=\"${CSS_HREF}\"><script defer src=\"${JS_SRC}\"></script><link rel=\"icon\" type=\"image/png\" href=\"${ICON_HREF}\"><link rel=\"shortcut icon\" href=\"${ICON_HREF}\"></head>|g" {} \;
          # Archive banner. This site stopped publishing on 2026-08-13 but is
          # deliberately left up: every issue URL here is already linked from
          # elsewhere and indexed, and breaking them to save a static host
          # would cost more than keeping it. The banner is styled inline so it
          # survives regardless of what the theme's stylesheet does.
          NEW_SITE="https://daily.jiayutool.cn/"
          BANNER="<div style=\"background:#2b2b2b;color:#f5f2ec;padding:12px 16px;text-align:center;font-size:15px;line-height:1.6\">本站已停止更新，内容归档保留。新站：<a href=\"${NEW_SITE}\" style=\"color:#e07a3f;font-weight:600\">daily.jiayutool.cn</a></div>"
          find output/public -name "*.html" -exec sed -i \
            -e "s|<body>|<body>${BANNER}|" {} \;
          cp rss.xml output/public/rss.xml
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-artifact
          path: 'output/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-artifact
