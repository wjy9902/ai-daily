[project]
name = "ai-daily"
version = "0.2.0"
description = "Evidence-first, fully automated AI daily digest"
dependencies = [
  "PyGithub>=2.6,<3",
  "feedgen>=1,<2",
  "feedparser>=6,<7",
  "httpx>=0.28,<1",
  "httpcore>=1,<2",
  "lxml>=5,<7",
  "markdown>=3.7,<4",
  "marko>=2.1,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
]
requires-python = ">=3.13"

[project.scripts]
ai-daily = "ai_daily.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["，", "：", "；"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ai_daily"]

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
