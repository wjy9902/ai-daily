    tier: A
    channel: official
    limit: 20
  # Restored with the move to the Tencent Cloud Singapore egress: this was dropped
  # only because GitHub Actions runner IPs were blocked, not because the feed changed.
  - name: microsoft-ai
    display_name: Microsoft AI
    kind: html_index
    url: https://microsoft.ai/blog/
    link_pattern: '^https://microsoft\.ai/news/[^/]+/?$'
    tier: A
