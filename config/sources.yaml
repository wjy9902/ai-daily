sources:
  # Frontier labs and platform vendors — first-party material.
  # This feed does not carry every launch, and there is no second inlet to add.
  # GPT-6 Astra shipped at openai.com/index/gpt-6-astra/ on 2026-09-03 and the
  # feed never listed it: only the safety overview and two customer stories.
  # Probed from the production egress that afternoon and again ten hours later
  # — openai.com/news/, /index/ and the article itself all answer 403 to
  # non-browser clients, the RSSHub openai/news route scrapes the same listing
  # and is missing it too, and neither @OpenAI nor @ChatGPT posted it. An
  # html_index source here would fail on every run, which is health-report
  # noise rather than coverage. What reached us was @sama and @gdb, and the
  # story is carried by cross-outlet clustering instead.
  - name: openai-news
    display_name: OpenAI
    kind: rss
    url: https://openai.com/news/rss.xml
    tier: A
    channel: official
    limit: 20
  # openai.com/news carries announcements, not shipped changes. Quota resets,
  # reserve allowances, model routing fixes and feature toggles land only in
  # the changelog, and those are the items readers act on: the 2026-08-28
  # benchmark digest opened with three of them (Codex quota reset, Luna
  # Reserve, temporary-chat controls) that this feed carries and news does not.
  # help.openai.com hosts the same notes but answers 403 to non-browser
  # clients, so this feed is the programmable inlet. The URL is the redirect
  # *target*: developers.openai.com/codex/changelog/rss.xml answers 308 here,
  # and the collector does not follow redirects, so probing it there failed.
  - name: openai-changelog
    display_name: ChatGPT & Codex Changelog
    kind: rss
    url: https://learn.chatgpt.com/docs/changelog/rss.xml
    tier: A
    channel: official
    limit: 25
  - name: anthropic-news
    display_name: Anthropic
    kind: html_index
    url: https://www.anthropic.com/news
    # Model launches are not filed under /news/: Fable 5.1 and Mythos 5.1
    # shipped at /claude-fable-and-mythos-5-1 (2026-09-01) and the index only
    # linked it from there, so the first-party post never reached us while
    # eight outlets covering it did. Root-level slugs are otherwise navigation
    # (/policy, /careers, /claude-corps), which come first in the DOM and would
    # eat the limit, so a launch slug must carry a version digit.
    link_pattern: '^https://www\.anthropic\.com/(?:news/[^/]+|claude-[a-z0-9-]*\d[a-z0-9-]*)$'
    tier: A
    channel: official
    limit: 15
  # Anthropic splits announcements across three surfaces. Product news that
  # never touches anthropic.com/news (Claude in Chrome GA, Cowork features)
  # lands on claude.com/blog; research announcements land on /research and
  # engineering posts on /engineering. Missing these cost the 2026-08-27 issue
  # two stories the benchmark digest led with.
  - name: claude-blog
    display_name: Claude Blog
    kind: html_index
    url: https://claude.com/blog
    link_pattern: '^https://claude\.com/blog/[^/]+$'
    tier: A
    channel: official
    limit: 15
  - name: anthropic-research
    display_name: Anthropic Research
    kind: html_index
    url: https://www.anthropic.com/research
    link_pattern: '^https://www\.anthropic\.com/research/[^/]+$'
    tier: A
    channel: official
    limit: 10
  - name: anthropic-engineering
    display_name: Anthropic Engineering
    kind: html_index
    url: https://www.anthropic.com/engineering
    link_pattern: '^https://www\.anthropic\.com/engineering/[^/]+$'
    tier: A
    channel: official
    limit: 10
  - name: google-ai
    display_name: Google AI
