    limit: 20
  # x.ai puts its index pages behind a Cloudflare challenge that answers 403 to
  # non-browser clients; article pages themselves answer 200. Kept at tier B so a
  # blocked index cannot count against Tier A coverage. Promote to A once the
  # Singapore egress is confirmed to get through.
  - name: xai-news
    display_name: xAI
    kind: html_index
    url: https://x.ai/news
    link_pattern: '^https://x\.ai/news/[^/]+$'
    tier: B
    channel: official
    limit: 15
    # Disabled: probed from the Singapore host on 2026-08-13 and the index still
    # answers 403. A source that fails every run is noise in the health report,
    # not coverage. Re-enable only after a probe shows it returning links.
    enabled: false
  - name: qwen-blog
    display_name: Qwen
    kind: rss
    url: https://qwenlm.github.io/blog/index.xml
    tier: A
    channel: official
    region: china
    limit: 20
  # Corroboration only. A repository `lastModified` timestamp is not a release
  # announcement: re-tagging, README edits and config pushes all move it, and reading
  # it as news has repeatedly produced false "release" claims. Tier C + community keeps
  # it out of lead stories; it may only confirm a release another source reported.
  - name: qwen-huggingface-models
    display_name: Qwen 官方模型库
    kind: huggingface_models
    url: https://huggingface.co/api/models
    namespace: Qwen
    tier: C
    channel: community
    region: china
    limit: 10
  # Same corroboration-only role for the other Chinese labs. Weight releases are
  # the one thing their 公众号 carries that has a first-party home outside WeChat,
  # and WeChat is the ingestion path that breaks: on 2026-09-01 an expired
  # credential cost us DeepSeek open-sourcing V4-Flash-Vision-Exp, which the
  # benchmark digest led with and which was on Hugging Face at 02:50 the whole
  # time. Product and pricing announcements still only exist on WeChat.
  - name: deepseek-huggingface-models
    display_name: DeepSeek 官方模型库
    kind: huggingface_models
