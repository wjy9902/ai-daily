sources:
  # Frontier labs and platform vendors — first-party material.
  - name: openai-news
    display_name: OpenAI
    kind: rss
    url: https://openai.com/news/rss.xml
    tier: A
    channel: official
    limit: 20
  - name: anthropic-news
    display_name: Anthropic
    kind: html_index
    url: https://www.anthropic.com/news
    link_pattern: '^https://www\.anthropic\.com/news/[^/]+$'
    tier: A
    channel: official
    limit: 15
  # Anthropic splits announcements across three surfaces. Product news that
  # never touches anthropic.com/news (Claude in Chrome GA, Cowork features)
  # lands on claude.com/blog; research announcements land on /research and
  # engineering posts on /engineering. Missing these cost the 2026-08-27 issue
  # two stories the benchmark digest led with.
  - name: claude-blog
    display_name: Claude Blog
    kind: html_index
    url: https://claude.com/blog
    link_pattern: '^https://claude\.com/blog/[^/]+$'
    tier: A
    channel: official
    limit: 15
  - name: anthropic-research
    display_name: Anthropic Research
    kind: html_index
    url: https://www.anthropic.com/research
    link_pattern: '^https://www\.anthropic\.com/research/[^/]+$'
    tier: A
    channel: official
    limit: 10
  - name: anthropic-engineering
    display_name: Anthropic Engineering
    kind: html_index
    url: https://www.anthropic.com/engineering
    link_pattern: '^https://www\.anthropic\.com/engineering/[^/]+$'
    tier: A
    channel: official
    limit: 10
  - name: google-ai
    display_name: Google AI
    kind: rss
    url: https://blog.google/technology/ai/rss/
    tier: A
    channel: official
    limit: 20
  # The technology/ai feed misses product-line posts (Gemini app, Workspace,
  # Search) that are exactly the announcements readers act on — the Gemini Live
  # productivity upgrade shipped under products/, invisible to the feed above.
  # The all-posts feed overlaps it; identical URLs collapse in clustering.
  - name: google-blog
    display_name: Google Blog
    kind: rss
    url: https://blog.google/rss/
    tier: A
    channel: official
    ai_focused: false
    limit: 30
  - name: deepmind
    display_name: Google DeepMind
    kind: rss
    url: https://deepmind.google/blog/rss.xml
    tier: A
    channel: official
    limit: 20
  - name: microsoft-research
    display_name: Microsoft Research
    kind: rss
    url: https://www.microsoft.com/en-us/research/feed/
    tier: A
    channel: official
    limit: 20
  # Restored with the move to the Tencent Cloud Singapore egress: this was dropped
  # only because GitHub Actions runner IPs were blocked, not because the feed changed.
  - name: microsoft-ai
    display_name: Microsoft AI
    kind: html_index
    url: https://microsoft.ai/blog/
    link_pattern: '^https://microsoft\.ai/news/[^/]+/?$'
    tier: A
    channel: official
    limit: 20
  - name: meta-ai
    display_name: Meta AI
    kind: rss
    url: https://about.fb.com/news/tag/ai/feed/
    tier: A
    channel: official
    limit: 20
  # x.ai puts its index pages behind a Cloudflare challenge that answers 403 to
  # non-browser clients; article pages themselves answer 200. Kept at tier B so a
  # blocked index cannot count against Tier A coverage. Promote to A once the
  # Singapore egress is confirmed to get through.
  - name: xai-news
    display_name: xAI
    kind: html_index
    url: https://x.ai/news
    link_pattern: '^https://x\.ai/news/[^/]+$'
    tier: B
    channel: official
    limit: 15
    # Disabled: probed from the Singapore host on 2026-08-13 and the index still
    # answers 403. A source that fails every run is noise in the health report,
    # not coverage. Re-enable only after a probe shows it returning links.
    enabled: false
  - name: qwen-blog
    display_name: Qwen
    kind: rss
    url: https://qwenlm.github.io/blog/index.xml
    tier: A
    channel: official
    region: china
    limit: 20
  # Corroboration only. A repository `lastModified` timestamp is not a release
  # announcement: re-tagging, README edits and config pushes all move it, and reading
  # it as news has repeatedly produced false "release" claims. Tier C + community keeps
  # it out of lead stories; it may only confirm a release another source reported.
  - name: qwen-huggingface-models
    display_name: Qwen 官方模型库
    kind: huggingface_models
    url: https://huggingface.co/api/models
    namespace: Qwen
    tier: C
    channel: community
    region: china
    limit: 10
  - name: mistral-news
    display_name: Mistral AI
    kind: rss
    url: https://mistral.ai/news/rss
    tier: A
    channel: official
    limit: 20
  - name: huggingface-blog
    display_name: Hugging Face
    kind: rss
    url: https://huggingface.co/blog/feed.xml
    tier: A
    channel: official
    limit: 20
  - name: nvidia-blog
    display_name: NVIDIA Blog
    kind: rss
    url: https://blogs.nvidia.com/feed/
    tier: B
    channel: official
    ai_focused: false
    limit: 20
  - name: aws-ml-blog
    display_name: AWS Machine Learning Blog
    kind: rss
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    tier: B
    channel: official
    limit: 20
  - name: github-ai-blog
