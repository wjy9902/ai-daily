    url: https://blog.cloudflare.com/tag/ai/rss/
    tier: B
    channel: official
    limit: 20
  - name: google-developers
    display_name: Google Developers Blog
    kind: rss
    url: https://developers.googleblog.com/feeds/posts/default
    tier: B
    channel: official
    ai_focused: false
    limit: 20
  - name: ollama-blog
    display_name: Ollama
    kind: rss
    url: https://ollama.com/blog/rss.xml
    tier: B
    channel: official
    limit: 15

  # Broad discovery and independent reporting — used for recall and corroboration.
  # 量子位 is restored with the Singapore egress for the same reason as microsoft-ai.
  - name: qbitai
    display_name: 量子位
    kind: html_index
    url: https://www.qbitai.com/
    link_pattern: '^https://www\.qbitai\.com/[0-9]{4}/[0-9]{2}/[0-9]+\.html$'
    tier: A
    channel: news
    region: china
    limit: 30
  - name: leiphone
    display_name: 雷峰网
    kind: rss
    url: https://www.leiphone.com/feed
    tier: B
    channel: news
    region: china
    limit: 30
  # 高频中文科技媒体：MiniMax 业绩会、国产芯片适配这类只在中文媒体首发的
  # 厂商动态，量子位和雷峰网经常晚于或漏于 IT之家。全站 feed 非 AI 居多，
  # 交给 is_ai_related 词表过滤。
  - name: ithome
    display_name: IT之家
    kind: rss
    url: https://www.ithome.com/rss/
    tier: B
    channel: news
    region: china
    ai_focused: false
    limit: 40
  # Techmeme aggregates the X-first news cycle (deals, leaks, "Sources:"
  # reporting from Bloomberg/Reuters/The Information) that no configured RSS
  # source carries. Until direct X ingestion exists this is the widest net for
  # the business-and-rumor half of the day.
  - name: techmeme
    display_name: Techmeme
    kind: rss
    url: https://www.techmeme.com/feed.xml
    tier: B
    channel: news
    ai_focused: false
    limit: 30
  # TestingCatalog specializes in gray releases, A/B tests and unannounced
  # features spotted in production apps — the 前瞻与传闻 beat.
  - name: testingcatalog
    display_name: TestingCatalog
    kind: rss
    url: https://www.testingcatalog.com/rss/
    tier: B
