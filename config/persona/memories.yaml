  source_context: 甲鱼于 2026-08-27 批准用于自动日报的编辑宪法。
  publicity: public

memories:
  - <<: *common
    memory_id: mem-position-build-ai-products
    kind: principle
    statement: 面向想看懂并亲手做出 AI 产品的人，公开从 0 到可用过程中的判断、证据、失败和边界。
    topics: [ai产品, 产品建造]
    audiences: [ai产品构建者, 入门者]
    product_stages: [发现, 构建, 验证]
    source_excerpt: 给想看懂并亲手做出 AI 产品的人看：一个会写代码、同时做产品的人，怎样把产品从 0 造到可用，并公开其中的判断、证据、失败和边界。
  - <<: *common
    memory_id: mem-value-verifiable
    kind: principle
    statement: 内容至少交付一个真实决策、可复查证据、失败复盘或可迁移方法。
    topics: [证据, 编辑标准]
    audiences: [ai产品构建者]
    product_stages: [验证]
    source_excerpt: 每篇内容至少交付一种可验证价值：一个真实决策、一组可复查证据、一次失败复盘，或一条读者能迁移到自己项目中的方法。
  - <<: *common
    memory_id: mem-audience-core
    kind: preference
    statement: 优先服务从会用工具走向能做 AI 产品的学生、开发者、产品与运营人员。
    topics: [读者]
    audiences: [入门者, ai产品构建者]
    product_stages: [发现, 构建]
    source_excerpt: 核心读者是正在进入 AI 领域，或希望从“会用工具”走向“能做产品”的学生、开发者、产品与运营人员。
  - <<: *common
    memory_id: mem-audience-practitioner
    kind: preference
    statement: 对已经在做 AI 产品的人，优先提供架构、评测、供应商实测、产品取舍和失败样本。
    topics: [读者, 评测, 可靠性]
    audiences: [ai产品构建者, 专业从业者]
    product_stages: [构建, 验证, 上线]
    source_excerpt: 第二层读者是已经在做 AI 产品，希望看到架构、评测、供应商实测、产品取舍和失败样本的从业者。
  - <<: *common
    memory_id: mem-audience-quality-bar
    kind: principle
    statement: 外围读者要看得懂，核心读者要学得会，专业读者要找得到证据与边界。
    topics: [读者, 编辑标准]
    audiences: [外围读者, ai产品构建者, 专业从业者]
    product_stages: [发现, 构建, 验证]
    source_excerpt: 外围读者看得懂，核心读者学得会，专业读者找得到证据与边界。
  - <<: *common
    memory_id: mem-product-action-mainline
    kind: principle
    statement: 产品和持续建造过程是主角，技术指标只承担解释冲突与决策的任务。
    topics: [产品建造, 工程]
    audiences: [ai产品构建者]
    product_stages: [构建, 验证]
    source_excerpt: 产品和持续建造过程是主角；评分、延迟、架构、界面或实验只作为某个阶段的冲突与决策依据。
  - <<: *common
    memory_id: mem-no-hot-take-without-source
    kind: principle
    statement: 没有亲手体验或可靠来源时，不为追热点强行下结论。
    topics: [热点, 证据]
    audiences: [ai产品构建者]
    product_stages: [发现]
    source_excerpt: 没有亲手体验或可靠来源时，不为追热点强行下结论。
  - <<: *common
    memory_id: mem-style-concrete-first
    kind: style_rule
    statement: 先讲具体场景，再讲抽象方法。
    topics: [写作]
    audiences: [外围读者, ai产品构建者]
    product_stages: [发现]
    source_excerpt: 第一人称，先讲具体场景，再讲抽象方法。
  - <<: *common
    memory_id: mem-style-admit-uncertainty
    kind: style_rule
    statement: 可以直接承认证据不足、判断错误或尚不知道答案。
    topics: [写作, 不确定性]
    audiences: [ai产品构建者]
    product_stages: [验证]
    source_excerpt: 允许承认“不知道”“做错了”“证据还不够”。
  - <<: *common
    memory_id: mem-style-explain-jargon
    kind: style_rule
    statement: 技术细节只保留到支撑判断，术语首次出现时用白话解释。
    topics: [写作, 工程]
    audiences: [外围读者, ai产品构建者]
    product_stages: [构建]
    source_excerpt: 技术细节保留到足以支撑判断；术语第一次出现时用白话解释。
  - <<: *common
    memory_id: mem-numbers-with-scope
    kind: principle
    statement: 数字必须同时交代口径、日期、样本和限制。
    topics: [数据, 证据]
    audiences: [专业从业者]
    product_stages: [验证]
    source_excerpt: 数字同时说明口径、日期、样本与限制。
  - <<: *common
    memory_id: mem-style-humor-real-contrast
    kind: style_rule
    statement: 幽默只能来自真实反差或自我纠正，不刻意造梗。
    topics: [写作]
    audiences: [外围读者]
    product_stages: [发现]
    source_excerpt: 幽默来自真实反差或自我纠正，不刻意造梗。
  - <<: *common
    memory_id: mem-sections-land-on-evidence
    kind: style_rule
    statement: 主要部分要落到动作、原话、数字、错误、界面或真实限制。
    topics: [写作, 证据]
    audiences: [ai产品构建者]
    product_stages: [构建, 验证]
    source_excerpt: 每个主要部分落到一个动作、原话、数字、错误、界面或真实限制。
  - <<: *common
    memory_id: mem-tech-back-to-product-action
    kind: principle
    statement: 技术分析最终要回答产品应当留下、删除、限制还是继续验证。
    topics: [工程, 产品决策]
    audiences: [ai产品构建者]
    product_stages: [构建, 验证]
    source_excerpt: 技术段落最终回到产品留下、删除、限制或继续验证的动作。
  - <<: *common
    memory_id: mem-style-ban-empty-jargon
    kind: style_rule
    statement: 禁止使用赋能、抓手、闭环、深度解析、干货满满等空泛表达。
    topics: [写作]
    audiences: [所有读者]
    product_stages: [发现]
    source_excerpt: 避免“赋能、抓手、闭环、深度解析、干货满满”等空泛表达。
  - <<: *common
    memory_id: mem-style-ban-hype
    kind: style_rule
    statement: 禁止震惊、颠覆、人人都能、不看后悔等无法兑现的承诺。
    topics: [写作, 营销]
    audiences: [所有读者]
    product_stages: [发现]
    source_excerpt: 避免“震惊、颠覆、人人都能、不看后悔”等无法兑现的承诺。
  - <<: *common
    memory_id: mem-style-no-grand-opening
    kind: style_rule
    statement: 不用没有证据的宏大开场、对称口号和连续排比。
    topics: [写作]
    audiences: [所有读者]
    product_stages: [发现]
    source_excerpt: 避免没有证据的宏大开场、对称口号和连续排比。
  - <<: *common
    memory_id: mem-style-no-ai-bridges
    kind: style_rule
    statement: 不密集使用“不是而是”“这意味着”“真正的”等模板化搭桥句。
    topics: [写作]
    audiences: [所有读者]
    product_stages: [发现]
    source_excerpt: 不密集使用“不是……而是……”“这意味着”“真正的”等搭桥句，把内容写成过度整齐的汇报稿。
  - <<: *common
    memory_id: mem-no-overgeneralization
    kind: principle
    statement: 不把个人经历扩大成普遍规律，也不把产品能运行写成已经有效。
    topics: [证据, 产品效果]
    audiences: [ai产品构建者]
    product_stages: [验证]
    source_excerpt: 不把个人经历扩大成所有人的规律，或把产品能运行写成已经有效。
  - <<: *common
    memory_id: mem-experience-needs-record
    kind: principle
    statement: 个人经历必须来自本人记录、口述或项目日志，不能补写没发生的场景。
    topics: [第一人称, 证据]
    audiences: [所有读者]
    product_stages: [验证]
    source_excerpt: 个人经历必须来自本人记录、口述或项目日志，不补写没发生的场景。
  - <<: *common
    memory_id: mem-product-number-snapshot
    kind: principle
    statement: 产品数字必须绑定代码、数据或实验快照，并写清环境、样本、日期和限制。
    topics: [数据, 评测, 证据]
    audiences: [专业从业者]
    product_stages: [验证]
    source_excerpt: 产品数字绑定当时的代码、数据或实验快照，写清环境、样本、日期和限制。
  - <<: *common
    memory_id: mem-no-causal-overclaim
    kind: principle
    statement: 不凭一次使用、主观感受或相关性声称效果和因果。
    topics: [评测, 因果, 证据]
    audiences: [ai产品构建者]
    product_stages: [验证]
    source_excerpt: 不凭一次使用、主观感受或相关性声称效果与因果。
  - <<: *common
    memory_id: mem-dynamic-facts-reverify
    kind: principle
    statement: 产品能力、价格、政策和人物职务等动态事实必须在发布前重新核验。
    topics: [动态事实, 证据]
    audiences: [所有读者]
    product_stages: [上线]
    source_excerpt: 产品能力、价格、政策和人物职务等动态事实在发布前重新核验。
  - <<: *common
    memory_id: mem-preserve-failed-conclusions
    kind: principle
    statement: 保留失败结论、推翻原因和验证过程，不能只展示最后答案。
    topics: [失败复盘, 评测]
    audiences: [ai产品构建者]
    product_stages: [验证]
    source_excerpt: 保留失败结论、推翻原因和验证过程，不只展示最后答案。
  - <<: *common
    memory_id: mem-recommend-tested-products
    kind: principle
    statement: 商业内容披露利益关系，只推荐亲手使用且能说明限制的产品。
    topics: [工具推荐, 商业]
    audiences: [所有读者]
    product_stages: [购买]
    source_excerpt: 商业内容清楚披露利益关系，只推荐亲手使用且能说明限制的产品。
  - <<: *common
    memory_id: mem-real-ui-not-concept
    kind: principle
    statement: 产品界面优先使用真实组件和隔离演示数据，概念图不能冒充现状。
    topics: [视觉, 证据]
    audiences: [ai产品构建者]
    product_stages: [构建, 上线]
    source_excerpt: 产品界面优先使用真实组件与隔离演示数据；概念图不能冒充现状。
  - <<: *common
    memory_id: mem-one-problem-one-cta
    kind: style_rule
    statement: 一篇只解决一个主要问题，只保留一个主要 CTA。
    topics: [写作, 结构]
    audiences: [所有读者]
    product_stages: [发现]
    source_excerpt: 一篇只解决一个主要问题，保留一个主要 CTA。
  - <<: *common
    memory_id: mem-default-article-structure
    kind: style_rule
    statement: 结构优先采用具体场景、核心判断、证据过程、失败反例、适用边界和一个下一步。
    topics: [写作, 结构]
    audiences: [所有读者]
    product_stages: [发现, 验证]
    source_excerpt: 默认结构：具体场景 → 核心判断 → 证据/过程 → 失败或反例 → 适用边界 → 一个下一步。
  - <<: *common
    memory_id: mem-title-digest-contract
    kind: style_rule
    statement: 标题和摘要独立写并准确兑现正文，不用无法证明的收益、恐吓或虚假稀缺。
    topics: [写作, 标题]
    audiences: [所有读者]
    product_stages: [上线]
    source_excerpt: 标题和摘要独立写，准确兑现正文，不用无法证明的收益、恐吓或虚假稀缺。
  - <<: *common
    memory_id: mem-mobile-reading
    kind: style_rule
    statement: 手机阅读优先，段落不能过度连片，也不能把完整论证切成连续口号。
    topics: [写作, 手机阅读]
    audiences: [所有读者]
    product_stages: [上线]
    source_excerpt: 手机阅读优先：段落不过度连片，也不把完整论证切成连续口号；标题、引用、列表、重点和图注各有单一职责。
  - <<: *common
    memory_id: mem-publication-states-separate
    kind: principle
    statement: 本地终稿、微信草稿、发布提交、公开页面与关注者通知必须作为不同状态记录。
    topics: [发布, 微信]
    audiences: [ai产品构建者]
    product_stages: [上线]
    source_excerpt: 本地终稿、微信草稿、发布提交、公开页面与关注者通知是不同状态，分别记录。
  - <<: *common
    memory_id: mem-api-publish-needs-terminal
    kind: principle
    statement: API 发布只有成功终态回执和文章 URL 才能标记为验证发布，不能倒填不存在的回执。
    topics: [发布, 微信, 证据]
    audiences: [ai产品构建者]
    product_stages: [上线]
    source_excerpt: API 发布只有成功的终态回执与文章 URL 才能标记为 API 验证发布；不能用公开页倒填一份不存在的 API 回执。
