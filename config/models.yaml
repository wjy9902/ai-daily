budget:
  # A runaway backstop, not an operating limit. Nothing here should ever be
  # reached by a working day, however many windows or manual re-runs it takes.
  #
  # Measured 2026-08-28..08-31, four to six windows a day: ¥3.1-4.0 spent,
  # 51-66 requests, 626-845k input tokens, 298-377k output tokens. The old
  # ceilings sat at roughly twice that, so ordinary operation kept brushing
  # them - and the tightest was not the money at all but output tokens, at
  # 377k of 500k on a six-run day. Raising cost alone would just have moved the
  # wall. All four move together, sized so cost is the only one a runaway can
  # actually reach: ¥40 buys about 6.4M output tokens at deepseek-v4-pro
  # prices, which is under the 8M ceiling below.
  #
  # What this is still protecting against is real and was seen the same week: a
  # cron that failed 586 times without anyone noticing, and a stage that burned
  # its whole retry allowance on every window. A loop that escapes review costs
  # ¥40 in a day here, not an open tab.
  #
  # tests/test_budget_staging.py asserts a full issue and a day's observed
  # spend both fit inside every stage share, so a change here cannot quietly
  # starve a stage.
  request_limit: 500
  input_token_limit: 20000000
  output_token_limit: 8000000
  cost_cny_limit: 40.0

roles:
  judge:
    # Relevance filtering is the highest-volume stage (one call per batch of
    # ten candidates), so the cheap model leads.
    primary:
      provider: deepseek
      model: deepseek-v4-flash
      timeout_seconds: 60
      # DeepSeek v4 emits reasoning tokens that count against this ceiling, so
      # a limit sized for the JSON alone truncates the answer mid-structure and
      # the schema check fails. Leave room for both.
      max_output_tokens: 8192
      temperature: 0.1
      input_cost_cny_per_million: 1.01
      output_cost_cny_per_million: 2.02
    fallback:
      provider: openai
      model: gpt-5.6-terra
      timeout_seconds: 90
      max_output_tokens: 4096
      # gpt-5.6-terra rejects any temperature other than 1. Determinism on this
      # stage comes from the schema and the validators, not from sampling.
      temperature: 1.0
      # ESTIMATE, deliberately padded upward. Published pricing was not
      # verifiable at configuration time, and the daily cost ceiling is only as
      # honest as these numbers. Over-estimating degrades a run early; under-
      # estimating overspends real money. Correct these from a billing
      # statement once the fallback has actually been exercised.
      input_cost_cny_per_million: 12.0
      output_cost_cny_per_million: 96.0
  editor:
    primary:
      provider: deepseek
      model: deepseek-v4-pro
      timeout_seconds: 180
      # Planning emits the largest structure in the pipeline (up to 29 selections
      # plus viewpoints) and this model spends roughly two thirds of its output
      # on reasoning. Measured twice: an 8192 ceiling truncated every plan, and
      # after the pool grew to 100 candidates a 24000 ceiling truncated at ~36k
      # observed output and cost the 2026-08-27 manual run its whole plan
      # stage. Cost, not this number, is what stops a runaway run.
      max_output_tokens: 48000
      temperature: 0.2
      input_cost_cny_per_million: 3.13
      output_cost_cny_per_million: 6.26
    fallback:
      provider: openai
      model: gpt-5.6-terra
      timeout_seconds: 150
      max_output_tokens: 8192
      temperature: 1.0
      # Same estimate caveat as above.
      input_cost_cny_per_million: 12.0
      output_cost_cny_per_million: 96.0
