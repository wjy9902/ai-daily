budget:
  # Shared by every timer window of the same day, not per process.
  #
  # Sized from the pipeline's actual shape rather than a round number: one
  # judge call per batch of ten candidates (10), one planning call, one draft
  # per detailed story (13), and any of them able to spend a second request on
  # its retry — 48 for a single issue at worst. tests/test_budget_staging.py
  # asserts the arithmetic so a config change cannot quietly starve a stage.
  #
  # The limit is per day and shared by every window, and each stage may only
  # use its STAGE_SHARE slice of it. That slice is what actually binds: at 100
  # the judge share was int(100 * 0.30) = 30, exactly three runs of ten
  # batches, so the 2026-08-28 07:00 window died on StageBudgetExceeded with
  # 45/100 requests and ¥2.48/¥5 still unspent. Four windows now need 40 judge
  # requests before retries; 180 gives the judge 54 and leaves the money limit
  # to be the thing that stops a runaway.
  request_limit: 180
  # Token ceilings are a backstop against a runaway loop, not the spending
  # control. Cost is. The old 30k output ceiling was the binding constraint and
  # aborted a real run at nine requests, which is the budget stopping work that
  # the money limit would happily have paid for. These are sized so that ¥5 is
  # reached first at current DeepSeek prices.
  input_token_limit: 2000000
  output_token_limit: 500000
  # Raised with the fourth window. The binding slice here is the planner's:
  # ¥5 gave it 5.0 * 0.25 = ¥1.25, and the 2026-08-28 runs spent ¥1.79 on plan
  # alone, so the next window's plan stage would refuse before spending
  # anything. A full issue costs about ¥1.0-1.4, so ¥8 covers four windows in
  # the worst case where every one of them re-plans.
  cost_cny_limit: 8.0

roles:
  judge:
    # Relevance filtering is the highest-volume stage (one call per batch of
    # ten candidates), so the cheap model leads.
    primary:
      provider: deepseek
      model: deepseek-v4-flash
      timeout_seconds: 60
      # DeepSeek v4 emits reasoning tokens that count against this ceiling, so
      # a limit sized for the JSON alone truncates the answer mid-structure and
      # the schema check fails. Leave room for both.
      max_output_tokens: 8192
      temperature: 0.1
      input_cost_cny_per_million: 1.01
      output_cost_cny_per_million: 2.02
    fallback:
      provider: openai
      model: gpt-5.6-terra
      timeout_seconds: 90
      max_output_tokens: 4096
      # gpt-5.6-terra rejects any temperature other than 1. Determinism on this
      # stage comes from the schema and the validators, not from sampling.
      temperature: 1.0
      # ESTIMATE, deliberately padded upward. Published pricing was not
      # verifiable at configuration time, and the daily cost ceiling is only as
      # honest as these numbers. Over-estimating degrades a run early; under-
      # estimating overspends real money. Correct these from a billing
      # statement once the fallback has actually been exercised.
      input_cost_cny_per_million: 12.0
      output_cost_cny_per_million: 96.0
  editor: &persona_editor
    primary:
      provider: deepseek
      model: deepseek-v4-pro
      timeout_seconds: 180
      # Planning emits the largest structure in the pipeline (up to 29 selections
      # plus viewpoints) and this model spends roughly two thirds of its output
      # on reasoning. Measured twice: an 8192 ceiling truncated every plan, and
      # after the pool grew to 100 candidates a 24000 ceiling truncated at ~36k
      # observed output and cost the 2026-08-27 manual run its whole plan
      # stage. Cost, not this number, is what stops a runaway run.
      max_output_tokens: 48000
      temperature: 0.2
      input_cost_cny_per_million: 3.13
      output_cost_cny_per_million: 6.26
    fallback:
      provider: openai
      model: gpt-5.6-terra
      timeout_seconds: 150
      max_output_tokens: 8192
      temperature: 1.0
      # Same estimate caveat as above.
      input_cost_cny_per_million: 12.0
      output_cost_cny_per_million: 96.0
  persona_planner:
    <<: *persona_editor
  persona_analyst:
    <<: *persona_editor
  persona_edition_editor:
    <<: *persona_editor
    primary:
      provider: deepseek
      model: deepseek-v4-pro
      timeout_seconds: 180
      # Thinking is disabled only for final assembly, so reserve for the compact
      # edition JSON rather than hidden reasoning tokens.
      max_output_tokens: 20000
      temperature: 0.1
      input_cost_cny_per_million: 3.13
      output_cost_cny_per_million: 6.26
    fallback:
      provider: openai
      model: gpt-5.6-terra
      timeout_seconds: 150
      max_output_tokens: 8192
      temperature: 1.0
      input_cost_cny_per_million: 12.0
      output_cost_cny_per_million: 96.0
  persona_critic:
    <<: *persona_editor
  persona_finalizer:
    <<: *persona_editor
  persona_baseline:
    <<: *persona_editor
